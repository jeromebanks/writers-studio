[project]
name = "writers-studio-project-schema"
version = "0.0.0"
description = "Python-side validation against the canonical JSON Schema in packages/project-schema/schema/."
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/writers_studio_project_schema"]
