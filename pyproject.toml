[tool.uv.workspace]
members = ["apps/worker", "packages/project-schema/python"]

[tool.uv]
dev-dependencies = ["pytest>=8.3", "ruff>=0.9", "mypy>=1.14", "types-jsonschema>=4.23"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests/contract", "apps/worker", "packages/project-schema/python"]
